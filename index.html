<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow:wght@400;600&display=swap"
      rel="stylesheet"
    />
</head>
<body>

    <div class="calculator">
        <!-- Display -->
        <div class="display">
            <div class="display__expression" id="expression">0</div>
            <div class="display__result" id="result"></div>
        </div>

        <!-- Button Grid -->
        <div class="buttons">

            <!-- Row 1 -->
            <button class="btn btn--utility btn--wide" id="btn-clear">AC</button>
            <button class="btn btn--utility" id="btn-backspace">⌫</button>
            <button class="btn btn--operator" data-operator="/">÷</button>

            <!-- Row 2 -->
            <button class="btn btn--digit" data-digit="7">7</button>
            <button class="btn btn--digit" data-digit="8">8</button>
            <button class="btn btn--digit" data-digit="9">9</button>
            <button class="btn btn--operator" data-operator="*">×</button>

            <!-- Row 3 -->
            <button class="btn btn--digit" data-digit="4">4</button>
            <button class="btn btn--digit" data-digit="5">5</button>
            <button class="btn btn--digit" data-digit="6">6</button>
            <button class="btn btn--operator" data-operator="-">-</button>
        </div>
    </div>
    
</body>
</html>
